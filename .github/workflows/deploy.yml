# Tests, builds and publishes the site to GitHub Pages.
#
# One-time setup in your repository: Settings > Pages > Build and deployment >
# Source: "GitHub Actions".
#
# The deployment jobs form a chain. The point of the chain is that a broken
# push fails loudly at `test` instead of quietly publishing: `deploy` cannot
# start until `build` succeeds, and `build` cannot start until `test` does.
# The scheduled/manual full browser sweep is an independent audit job.
#
# Every push and pull request runs the fast test job. Only main publishes.
name: Test, build and deploy

on:
  push:
  pull_request:
  schedule:
    - cron: '17 3 * * 0'
  # A manual run can exercise the full corpus without waiting for the weekly run.
  workflow_dispatch:
    inputs:
      full_sweep:
        description: Run the full-corpus browser sweep
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # A newer push must wait for an in-flight Pages deployment to finish.
  cancel-in-progress: false

# Pinned to the exact version development runs, not a floating major. The
# suite and the data scripts are .mts and rely on Node executing TypeScript
# directly (unflagged from 23.6); pinning the patch level means CI and local
# cannot silently diverge on runtime behaviour. Bump deliberately, with the
# local toolchain, not by letting the runner drift ahead.
env:
  NODE_VERSION: '24.18.0'

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # CI logs previously said "No build cache found" — .next/cache was
      # never persisted between runs, so every build started cold. Per
      # node_modules/next/dist/docs/01-app/02-guides/ci-build-caching.md's
      # own GitHub Actions example: key on the lockfile plus source files,
      # with a lockfile-only restore-key so a source-only change still
      # rebuilds from a prior cache instead of from nothing.
      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # `npm test` bundles four commands; run here as named steps so the
      # checks UI says WHICH phase failed instead of "Tests → exit code 1".
      # Deliberately not built with NEXT_PUBLIC_BASE_PATH: the tests assert
      # on site-absolute paths, and the base path is verified separately below.
      - name: Citations resolve
        run: npm run cite

      - name: Build (root path, for the test suites)
        run: npm run build

      - name: Unit and regression tests
        run: npm run test:unit

      - name: Cross-check stated facts
        run: npm run facts

      # The palette check is a separate guarantee from the contrast tests: it
      # re-derives every badge and accent from source and exits non-zero on
      # anything below AA.
      - name: Verify the derived palette still clears WCAG AA
        run: npm run palette

      # Whether the committed geometry still chains and no station has drifted
      # more than 200 m from its alignment.
      - name: Audit route geometry
        run: npm run geometry:audit

      # Heading order, alt text, SVG semantics, landmarks, language tagging.
      # Also run inside the test suite; kept here as a named step so a failure
      # is legible in the checks list rather than buried in test output.
      - name: Accessibility audit
        run: npm run a11y

      # Real Chromium: template-level reflow at 200%/400% zoom, keyboard
      # traversal, the accessibility tree, axe-core, screenshots and print.
      # The explicit full mode keeps the exhaustive reflow/axe sweep for the
      # scheduled/manual job below. Structure checks cannot see any of this.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser verification
        run: npm run verify:browser

      # Hostile fixtures: malformed frontmatter, injection, unicode, and the
      # inputs that used to build silently. Slow (one full build per case), so
      # it runs after everything cheaper has passed.
      - name: Adversarial fixtures
        run: npm run adversarial

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            docs/browser-verification.json
            docs/adversarial-results.json
            docs/screenshots/
            docs/print/
          retention-days: 14

      # Not gating — the confusable pairs are a property of the operators'
      # official colours and cannot be "fixed". This prints the current state so
      # a colour change that makes two lines harder to tell apart is visible in
      # the log rather than discovered by a reader.
      - name: Report colour vision deficiency simulation
        run: npm run cvd
        continue-on-error: true

  build:
    name: Build for Pages
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      # Serves the site from https://<user>.github.io/<repo>/ .
      # If you move to a custom domain or a <user>.github.io repo, delete the
      # NEXT_PUBLIC_BASE_PATH line so the site builds for the root path.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # Re-check links against the deployment build specifically. A base-path
      # bug cannot show up in the root-path build the tests use, and it is
      # exactly the kind of breakage that only appears once published.
      - name: Check links in the deployment build
        run: npm run check
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  full-browser-sweep:
    name: Full browser sweep
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_sweep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Cache Next.js build cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', '**/*.mts') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-
      - name: Build export for the exhaustive sweep
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser verification (full corpus)
        run: npm run verify:browser:full
      - name: Upload full-sweep artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-browser-verification
          path: |
            docs/browser-verification.json
            docs/browser-verification.md
            docs/screenshots/
            docs/print/
          retention-days: 14
