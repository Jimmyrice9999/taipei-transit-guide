<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Taiwan Transit Guide</title>
  <rect width="32" height="32" rx="5" fill="#0C0D0F"/>
  <!-- A fragment of the destination blind: four lit dots forming a T,
       in the same amber as the wordmark. -->
  <g fill="#FFB000">
    <circle cx="8"  cy="9"  r="2.4"/>
    <circle cx="16" cy="9"  r="2.4"/>
    <circle cx="24" cy="9"  r="2.4"/>
    <circle cx="16" cy="16" r="2.4"/>
    <circle cx="16" cy="23" r="2.4"/>
  </g>
  <g fill="rgba(255,176,0,0.16)">
    <circle cx="8"  cy="16" r="2.4"/>
    <circle cx="24" cy="16" r="2.4"/>
    <circle cx="8"  cy="23" r="2.4"/>
    <circle cx="24" cy="23" r="2.4"/>
  </g>
</svg>
